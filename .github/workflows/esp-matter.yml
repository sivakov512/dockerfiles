name: ESP-Matter image

on:
  push:
    branches: [main]
    paths:
      - "esp-matter/**"
      - ".github/workflows/esp-matter.yml"
  pull_request:
    paths:
      - "esp-matter/**"
      - ".github/workflows/esp-matter.yml"
  # Picks up updates of the official base image
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: esp-matter
  LATEST_TAG: release_v1.6.1-idf_v6.0.2

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # base_tag: tag of the official espressif/esp-matter image
          - base_tag: release-v1.6.1_idf_v6.0.2
            tag: release_v1.6.1-idf_v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image URI and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          TAG="${{ matrix.tag }}"

          echo "primary_tag=$IMAGE_URI:$TAG" >> $GITHUB_OUTPUT
          {
            echo "tags<<EOF"
            echo "$IMAGE_URI:$TAG"
            if [[ "$TAG" == "${{ env.LATEST_TAG }}" ]]; then
              echo "$IMAGE_URI:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./esp-matter
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.primary_tag }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=inline' || '' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -w /tmp --entrypoint bash ${{ steps.vars.outputs.primary_tag }} -c '
            . /opt/esp/entrypoint.sh
            set -euo pipefail
            test "$PWD" = /tmp
            clang-tidy --version | grep -q Espressif
            clang-format --version | grep -q Espressif
            clang-tidy --version | head -1
            idf.py --version && test -n "$ESP_MATTER_PATH" && echo "ESP_MATTER_PATH=$ESP_MATTER_PATH"
          '
          docker run --rm ${{ steps.vars.outputs.primary_tag }} idf.py --version
