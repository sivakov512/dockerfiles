name: ESP-IDF image

on:
  push:
    branches: [main]
    paths:
      - "esp-idf/**"
      - ".github/workflows/esp-idf.yml"
  pull_request:
    paths:
      - "esp-idf/**"
      - ".github/workflows/esp-idf.yml"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: esp-idf
  LATEST_IDF_REF: v6.1.1

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # v6.0.2: base of the esp-matter image (esp-matter release/v1.6.1 wants it)
        idf_ref: [v6.0.2, v6.1.1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image URI and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          IDF="${{ matrix.idf_ref }}"

          echo "primary_tag=$IMAGE_URI:$IDF" >> $GITHUB_OUTPUT
          {
            echo "tags<<EOF"
            echo "$IMAGE_URI:$IDF"
            if [[ "$IDF" == "${{ env.LATEST_IDF_REF }}" ]]; then
              echo "$IMAGE_URI:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./esp-idf
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            IDF_REF=${{ matrix.idf_ref }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.primary_tag }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=inline' || '' }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -w /tmp --entrypoint bash ${{ steps.vars.outputs.primary_tag }} -c '
            . /opt/esp/entrypoint.sh
            set -euo pipefail
            test "$PWD" = /tmp
            clang-tidy --version | grep -q Espressif
            clang-format --version | grep -q Espressif
            clang-tidy --version | head -1
            idf.py --version
          '
          docker run --rm ${{ steps.vars.outputs.primary_tag }} idf.py --version
          docker image inspect --format 'Uncompressed size: {{.Size}} bytes' ${{ steps.vars.outputs.primary_tag }}

      - name: Lint the project template with the image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint bash ${{ steps.vars.outputs.primary_tag }} -c '
            . /opt/esp/entrypoint.sh
            set -euo pipefail
            git clone --depth 1 https://github.com/sivakov512/esp-idf-project-template.git /tmp/template
            cd /tmp/template
            make esp-lint check-format host-test
          '
